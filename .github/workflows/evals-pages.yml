name: Affordance evals Pages

on:
  push:
    branches:
      - main
      - skill/init-affordance-design
    paths:
      - 'evals/**'
      - 'prototypes/assignment/runtime/**'
      - 'prototypes/contact-merge/runtime/**'
      - 'prototypes/shipment-move/runtime/**'
      - '.github/workflows/evals-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            prototypes/assignment/runtime/package.json
            prototypes/contact-merge/runtime/package.json
            prototypes/shipment-move/runtime/package.json

      - name: Validate eval requirement briefs and build manifest
        run: node evals/validate-cases.mjs --manifest _site/cases.json

      - name: Install case 001 prototype dependencies
        working-directory: prototypes/assignment/runtime
        run: npm install --no-audit --no-fund

      - name: Build case 001 prototype for Pages subpath
        working-directory: prototypes/assignment/runtime
        env:
          EXPO_BASE_URL: /Affordance-Design/cases/001-bulk-assignment/prototype
        run: npm run export:web

      - name: Install case 002 prototype dependencies
        working-directory: prototypes/contact-merge/runtime
        run: npm install --no-audit --no-fund

      - name: Build case 002 prototype for Pages subpath
        working-directory: prototypes/contact-merge/runtime
        env:
          EXPO_BASE_URL: /Affordance-Design/cases/002-merge-command-contract/prototype
        run: npm run export:web

      - name: Install case 003 prototype dependencies
        working-directory: prototypes/shipment-move/runtime
        run: npm install --no-audit --no-fund

      - name: Build case 003 prototype for Pages subpath
        working-directory: prototypes/shipment-move/runtime
        env:
          EXPO_BASE_URL: /Affordance-Design/cases/003-move-access-paths/prototype
        run: npm run export:web

      - name: Assemble eval site
        run: |
          cp evals/index.html _site/index.html
          for case_dir in evals/cases/*; do
            [ -d "$case_dir" ] || continue
            case_id="$(basename "$case_dir")"
            mkdir -p "_site/cases/$case_id"
            cp "$case_dir/index.html" "_site/cases/$case_id/index.html"
            cp "$case_dir/case.json" "_site/cases/$case_id/case.json"
          done
          mkdir -p _site/cases/001-bulk-assignment/prototype
          cp -R prototypes/assignment/runtime/dist-web/. _site/cases/001-bulk-assignment/prototype/
          mkdir -p _site/cases/002-merge-command-contract/prototype
          cp -R prototypes/contact-merge/runtime/dist-web/. _site/cases/002-merge-command-contract/prototype/
          mkdir -p _site/cases/003-move-access-paths/prototype
          cp -R prototypes/shipment-move/runtime/dist-web/. _site/cases/003-move-access-paths/prototype/
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'github-pages' || 'eval-pages-preview' }}
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            prototypes/assignment/runtime/package.json
            prototypes/contact-merge/runtime/package.json
            prototypes/shipment-move/runtime/package.json

      - name: Install case 001 prototype dependencies
        working-directory: prototypes/assignment/runtime
        run: npm install --no-audit --no-fund

      - name: Install case 002 prototype dependencies
        working-directory: prototypes/contact-merge/runtime
        run: npm install --no-audit --no-fund

      - name: Install case 003 prototype dependencies
        working-directory: prototypes/shipment-move/runtime
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        working-directory: prototypes/assignment/runtime
        run: npx playwright install --with-deps chromium

      - name: Verify deployed case 001 requirement and prototype
        working-directory: prototypes/assignment/runtime
        env:
          PROTOTYPE_URL: https://freedivingin.github.io/Affordance-Design/cases/001-bulk-assignment/prototype/
        run: node e2e/pages-smoke.mjs

      - name: Verify deployed case 002 requirement and prototype
        working-directory: prototypes/contact-merge/runtime
        env:
          PROTOTYPE_URL: https://freedivingin.github.io/Affordance-Design/cases/002-merge-command-contract/prototype/
        run: node e2e/pages-smoke.mjs

      - name: Verify deployed case 003 requirement and prototype
        working-directory: prototypes/shipment-move/runtime
        env:
          PROTOTYPE_URL: https://freedivingin.github.io/Affordance-Design/cases/003-move-access-paths/prototype/
        run: node e2e/pages-smoke.mjs
