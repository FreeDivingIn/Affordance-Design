<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Affordance Design Eval</title>
  <style>
    :root { color-scheme: light dark; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: Canvas; color: CanvasText; }
    main { width: min(1180px, calc(100% - 32px)); margin: 24px auto 48px; }
    header { margin-bottom: 20px; }
    h1 { margin: 10px 0 6px; font-size: 28px; }
    h2 { font-size: 18px; margin: 0 0 10px; }
    h3 { font-size: 14px; margin: 18px 0 6px; text-transform: uppercase; letter-spacing: .04em; opacity: .7; }
    p, li { line-height: 1.5; }
    .muted { opacity: .68; }
    .grid { display: grid; grid-template-columns: minmax(300px, 390px) 1fr; gap: 18px; align-items: start; }
    .panel { border: 1px solid color-mix(in srgb, CanvasText 20%, transparent); padding: 16px; }
    .direction { display: inline-block; border: 1px solid color-mix(in srgb, CanvasText 22%, transparent); padding: 4px 8px; font-size: 13px; }
    ul { margin: 0; padding-left: 20px; }
    li + li { margin-top: 8px; }
    iframe { display: block; width: 100%; min-height: 720px; border: 1px solid color-mix(in srgb, CanvasText 20%, transparent); background: white; }
    .links { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 18px; }
    a { color: LinkText; }
    .error { border: 1px solid currentColor; padding: 12px; }
    @media (max-width: 820px) {
      main { width: min(100% - 20px, 720px); margin-top: 14px; }
      .grid { grid-template-columns: 1fr; }
      iframe { min-height: 700px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <a href="../../">← All evals</a>
      <h1 id="case-title">Loading case…</h1>
      <p class="muted">Reviewer context and assertions stay on this page; the embedded prototype contains only product UI.</p>
    </header>

    <div class="grid">
      <aside class="panel" id="requirement-panel">
        <h2>Requirement brief</h2>
        <div id="requirement-content">Loading requirement…</div>
        <div class="links">
          <a href="./prototype/" target="_blank" rel="noreferrer">Open prototype only</a>
          <a href="./case.json" target="_blank" rel="noreferrer">case.json</a>
        </div>
      </aside>

      <section>
        <iframe src="./prototype/" title="Runnable product prototype"></iframe>
      </section>
    </div>
  </main>

  <script>
    const directionLabels = {
      feature_creation: 'Feature creation',
      feature_upgrade: 'Feature upgrade',
      feature_optimization: 'Feature optimization',
    }

    function appendSection(parent, label, value, id) {
      const heading = document.createElement('h3')
      heading.textContent = label
      parent.appendChild(heading)

      const paragraph = document.createElement('p')
      if (id) paragraph.id = id
      paragraph.textContent = value
      parent.appendChild(paragraph)
    }

    async function renderCase() {
      const response = await fetch('./case.json', { cache: 'no-store' })
      if (!response.ok) throw new Error(`case.json request failed: ${response.status}`)

      const data = await response.json()
      const requirement = data.requirement
      document.title = `Eval ${data.id} — ${data.title}`
      document.querySelector('#case-title').textContent = `${data.id} — ${data.title}`

      const content = document.querySelector('#requirement-content')
      content.replaceChildren()

      appendSection(content, 'Goal', requirement.requirement_goal, 'requirement-goal')
      appendSection(content, 'Background', requirement.background, 'requirement-background')
      appendSection(content, 'Current state', requirement.current_state, 'requirement-current-state')

      const directionHeading = document.createElement('h3')
      directionHeading.textContent = 'Optimization direction'
      content.appendChild(directionHeading)

      const direction = document.createElement('span')
      direction.id = 'requirement-direction'
      direction.className = 'direction'
      direction.textContent = directionLabels[requirement.optimization_direction] || requirement.optimization_direction
      content.appendChild(direction)

      const expectedHeading = document.createElement('h3')
      expectedHeading.textContent = 'Expected behavior'
      content.appendChild(expectedHeading)

      const expected = document.createElement('ul')
      expected.id = 'expected-behavior'
      for (const item of data.expected || []) {
        const li = document.createElement('li')
        li.textContent = item
        expected.appendChild(li)
      }
      content.appendChild(expected)
      document.querySelector('#requirement-panel').dataset.ready = 'true'
    }

    renderCase().catch((error) => {
      const content = document.querySelector('#requirement-content')
      content.className = 'error'
      content.textContent = `Unable to load case requirement: ${error.message}`
    })
  </script>
</body>
</html>
